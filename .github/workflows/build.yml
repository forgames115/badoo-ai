name: build
on: [push, workflow_dispatch, release]
jobs:
  deb:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos.git
          theos-sdks: https://github.com/theos/sdks
      - run: cd BadooAI && make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j4
      - uses: actions/upload-artifact@v4
        with:
          name: badoo-ai-deb
          path: BadooAI/packages/*.deb
          if-no-files-found: error
